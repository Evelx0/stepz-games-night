<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plinko - STEPZ DEBATES</title>
    <style>
        /* --- FONTS --- */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto+Condensed:wght@700&display=swap');

        /* --- VARIABLES --- */
        :root {
            --bg-color: #0f0f0f;
            --gold-accent: #d4af37;
            --primary-red: #c41e3a;
            --text-white: #ffffff;
            --peg-color: #fff;
            --ball-color: #ff0054;
            --font-display: 'Cinzel', serif;
            --font-ui: 'Roboto Condensed', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--gold-accent);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 15px;
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 10px;
            border: 3px solid var(--gold-accent);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            object-fit: cover;
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            color: var(--gold-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000;
            margin: 0;
        }

        /* --- CANVAS AREA --- */
        .canvas-wrapper {
            position: relative;
            margin-bottom: 20px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #111;
            box-shadow: inset 0 0 20px #000;
        }

        canvas {
            display: block;
            border-radius: 10px;
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            padding-top: 10px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: var(--font-display);
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            min-width: 150px;
        }

        .btn-drop {
            background: var(--primary-red);
            color: white;
            border: 2px solid #ff4d6d;
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--primary-red);
        }

        .btn:disabled {
            filter: grayscale(100%);
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- HISTORY LOG --- */
        .history-bar {
            display: flex;
            gap: 5px;
            margin-top: 15px;
            height: 35px;
            justify-content: center;
            width: 100%;
            overflow: hidden;
        }

        .history-item {
            width: 50px;
            height: 100%;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            animation: popIn 0.3s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="game-container">
        
        <header class="header">
            <img src="logo.jpeg" alt="STEPZ Logo" class="logo">
            <h1>Stepz Plinko</h1>
        </header>

        <div class="canvas-wrapper">
            <canvas id="plinkoCanvas" width="600" height="500"></canvas>
        </div>

        <div class="controls">
            <button class="btn btn-drop" id="drop-btn">DROP BALL</button>
        </div>

        <div class="history-bar" id="history-bar">
            </div>

    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('plinkoCanvas');
    const ctx = canvas.getContext('2d');
    const dropBtn = document.getElementById('drop-btn');
    const historyBar = document.getElementById('history-bar');

    // --- CONFIGURATION ---
    const ROWS = 12; // Height of pyramid
    const PEG_RADIUS = 4;
    const BALL_RADIUS = 7;
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    
    // UPDATED MULTIPLIERS: Max 3x, Lows 0.1-0.2, Center 0
    const MULTIPLIERS = [3, 1.5, 0.2, 0.1, 0, 0, 0, 0, 0, 0.1, 0.2, 1.5, 3];
    
    // UPDATED COLORS
    const BUCKET_COLORS = [
        '#ff0054', // 3x (Red)
        '#ff7b00', // 1.5x (Orange)
        '#d43790', // 0.2x (Purple)
        '#7a37d4', // 0.1x (Deep Purple)
        '#333333', '#222222', '#111111', '#222222', '#333333', // 0x (Dead Zone)
        '#7a37d4', // 0.1x
        '#d43790', // 0.2x
        '#ff7b00', // 1.5x
        '#ff0054'  // 3x
    ];

    let particles = []; 
    let pegs = [];

    // --- SETUP PEGS ---
    function initBoard() {
        const spacingX = WIDTH / (ROWS + 2); // Dynamic spacing
        const spacingY = (HEIGHT - 50) / (ROWS + 2); 
        const startY = 50;

        for (let row = 0; row < ROWS; row++) {
            for (let col = 0; col <= row; col++) {
                // Offset x to center the pyramid
                const x = (WIDTH / 2) - (row * spacingX / 2) + (col * spacingX);
                const y = startY + row * spacingY;
                pegs.push({ x, y });
            }
        }
    }

    // --- BALL LOGIC ---
    class Ball {
        constructor() {
            this.x = WIDTH / 2 + (Math.random() - 0.5) * 5; // Slight random start jitter
            this.y = 10;
            this.vx = 0;
            this.vy = 0;
            this.radius = BALL_RADIUS;
            this.friction = 0.5; // Bounciness
            this.gravity = 0.25;
            this.finished = false;
        }

        update() {
            if (this.finished) return;

            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;

            // Collision with Pegs
            for (let peg of pegs) {
                const dx = this.x - peg.x;
                const dy = this.y - peg.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < this.radius + PEG_RADIUS) {
                    // Collision Normal
                    const angle = Math.atan2(dy, dx);
                    
                    const force = 0.5; // Bounce strength
                    const randomJitter = (Math.random() - 0.5) * 0.1;
                    
                    this.vx = Math.cos(angle) * force + randomJitter; 
                    this.vy = Math.sin(angle) * force;
                    
                    // Prevent sticking inside peg
                    this.x = peg.x + Math.cos(angle) * (this.radius + PEG_RADIUS + 1);
                    this.y = peg.y + Math.sin(angle) * (this.radius + PEG_RADIUS + 1);
                }
            }

            // Wall Collisions
            if (this.x < 0) { this.x = 0; this.vx *= -1; }
            if (this.x > WIDTH) { this.x = WIDTH; this.vx *= -1; }

            // Finish Condition (Bottom)
            if (this.y > HEIGHT - 30) {
                this.finished = true;
                this.resolveResult();
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff0054';
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.closePath();
        }

        resolveResult() {
            // Determine which bucket index it landed in
            const bucketWidth = WIDTH / MULTIPLIERS.length;
            let index = Math.floor(this.x / bucketWidth);
            
            // Safety clamp
            if (index < 0) index = 0;
            if (index >= MULTIPLIERS.length) index = MULTIPLIERS.length - 1;

            const multiplier = MULTIPLIERS[index];
            const color = BUCKET_COLORS[index];
            
            addHistory(multiplier, color);
            
            // Remove ball from array after short delay
            setTimeout(() => {
                particles = particles.filter(p => p !== this);
                if (particles.length === 0) dropBtn.disabled = false;
            }, 100);
        }
    }

    // --- DRAWING ---
    function draw() {
        ctx.fillStyle = '#0f0f0f';
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // Draw Buckets (Multipliers)
        const bucketW = WIDTH / MULTIPLIERS.length;
        const bucketH = 30;
        const bucketY = HEIGHT - bucketH;

        for (let i = 0; i < MULTIPLIERS.length; i++) {
            ctx.fillStyle = BUCKET_COLORS[i];
            // Dim them slightly
            ctx.globalAlpha = 0.4; // Increased visibility for buckets
            ctx.fillRect(i * bucketW, bucketY, bucketW, bucketH);
            ctx.globalAlpha = 1.0;
            
            // Text
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Roboto Condensed';
            ctx.textAlign = 'center';
            // If 0, show "MISS" or just "0x"
            let text = MULTIPLIERS[i] === 0 ? "0x" : MULTIPLIERS[i] + "x";
            ctx.fillText(text, i * bucketW + bucketW / 2, bucketY + 20);
        }

        // Draw Pegs
        ctx.fillStyle = '#d4af37'; // Gold
        for (let peg of pegs) {
            ctx.beginPath();
            ctx.arc(peg.x, peg.y, PEG_RADIUS, 0, Math.PI * 2);
            ctx.fill();
        }

        // Update & Draw Balls
        for (let p of particles) {
            p.update();
            p.draw();
        }

        requestAnimationFrame(draw);
    }

    function addHistory(mult, color) {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.style.backgroundColor = color;
        
        // Show "MISS" for 0x, otherwise show multiplier
        if (mult === 0) {
            div.textContent = "MISS";
            div.style.color = "#aaa"; // Dim text for loss
            div.style.border = "1px solid #555";
        } else {
            div.textContent = mult + 'x';
            div.style.color = "#fff";
        }
        
        // Add to front
        historyBar.prepend(div);
        
        // Limit history length
        if (historyBar.children.length > 8) {
            historyBar.removeChild(historyBar.lastChild);
        }
    }

    // --- EVENTS ---
    dropBtn.addEventListener('click', () => {
        particles.push(new Ball());
    });

    // Start
    initBoard();
    draw();
});
</script>
</body>
</html>
