<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deal or No Deal - Stepz Debates</title>
    <style>
        /* --- FONTS --- */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto+Condensed:wght@700&display=swap');

        /* --- VARIABLES --- */
        :root {
            --bg-color: #0f0f0f;
            --box-red: #c41e3a; /* The Classic Box Red */
            --box-shadow: #7a0b20;
            --gold-accent: #d4af37;
            --panel-blue: #0044cc;
            --panel-red: #cc0000;
            --text-white: #ffffff;
            --font-display: 'Cinzel', serif;
            --font-ui: 'Roboto Condensed', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background: radial-gradient(circle at center, #2a0a10 0%, #000000 100%);
            color: var(--text-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 1000px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--gold-accent);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.1);
        }

        /* --- HEADER & LOGO --- */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--gold-accent);
            padding-bottom: 15px;
        }
        
        /* RESTORED LOGO STYLING */
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 10px;
            border: 3px solid var(--gold-accent); /* Gold border to match theme */
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            object-fit: cover;
        }
        
        .header h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--gold-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #000;
            margin: 0;
        }

        /* --- MAIN LAYOUT --- */
        .game-board {
            display: grid;
            grid-template-columns: 200px 1fr 200px; /* Classic Wings Layout */
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 850px) {
            .game-board {
                grid-template-columns: 1fr 1fr;
                grid-template-areas: 
                    "status status"
                    "grid grid"
                    "left right"
                    "player player";
            }
            .main-content { grid-area: grid; }
            #values-low { grid-area: left; }
            #values-high { grid-area: right; }
            .player-box-area { grid-area: player; }
            .game-status { grid-area: status; }
        }

        /* --- VALUE BOARDS (The Wings) --- */
        .values-board ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
        
        .values-board li {
            padding: 8px 5px;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            border-radius: 4px;
            color: white;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            transition: opacity 0.5s, transform 0.5s;
        }

        .values-board li.low { 
            background: linear-gradient(90deg, #0033aa, #0055ff); 
            text-shadow: 0 0 5px #00aaff;
        }
        
        .values-board li.high { 
            background: linear-gradient(90deg, #aa0000, #ff0000); 
            text-shadow: 0 0 5px #ff5555;
        }
        
        .values-board li.eliminated {
            background: #222;
            color: #444;
            box-shadow: none;
            border-color: #333;
            transform: scale(0.95);
        }

        /* --- CENTER AREA --- */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            perspective: 1000px; /* Essential for 3D flip */
        }

        .game-status {
            font-family: var(--font-display);
            font-size: 1.4rem;
            color: var(--gold-accent);
            margin-bottom: 20px;
            text-align: center;
            min-height: 1.6em;
            text-shadow: 0 2px 4px black;
        }

        .briefcase-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
        }

        /* --- 3D BRIEFCASE STYLING --- */
        .briefcase-container {
            aspect-ratio: 4/3;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
        }

        .briefcase-container:hover { transform: scale(1.05); }
        .briefcase-container.opened { transform: rotateY(180deg); cursor: default; }
        .briefcase-container.chosen { display: none; } /* Hide chosen from grid */

        .briefcase-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* FRONT: The Red Box */
        .briefcase-front {
            background: radial-gradient(circle at 30% 30%, #ff4d6d, var(--box-red));
            border: 2px solid #ff8fa3;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        /* Straps decoration */
        .briefcase-front::before, .briefcase-front::after {
            content: ''; position: absolute; background: rgba(0,0,0,0.2);
        }
        .briefcase-front::before { width: 100%; height: 4px; top: 20%; }
        .briefcase-front::after { width: 100%; height: 4px; bottom: 20%; }

        /* BACK: The Value */
        .briefcase-back {
            background: white;
            color: #333;
            transform: rotateY(180deg);
            border: 4px solid white;
            font-family: var(--font-display);
        }
        .briefcase-back.val-low { color: var(--panel-blue); border-color: var(--panel-blue); }
        .briefcase-back.val-high { color: var(--panel-red); border-color: var(--panel-red); }

        /* --- PLAYER BOX --- */
        .player-box-area {
            margin-top: 30px;
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .player-box-area h3 { color: var(--gold-accent); margin-bottom: 10px; font-family: var(--font-display); }
        
        .player-box-display .briefcase-container {
            width: 150px;
            margin: 0 auto;
        }

        /* --- OVERLAYS --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: all 0.5s ease;
            z-index: 100;
            backdrop-filter: blur(5px);
            border-radius: 15px;
        }
        .overlay.active { opacity: 1; visibility: visible; }

        .overlay h2 {
            font-family: var(--font-display);
            font-size: 3rem;
            color: var(--gold-accent);
            margin-bottom: 20px;
            text-align: center;
        }

        /* PHONE ANIMATION */
        .phone-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: ring 0.5s infinite;
            display: none;
        }
        @keyframes ring {
            0% { transform: rotate(0); }
            10% { transform: rotate(10deg); }
            30% { transform: rotate(-10deg); }
            50% { transform: rotate(5deg); }
            70% { transform: rotate(-5deg); }
            100% { transform: rotate(0); }
        }
        .banker-active .phone-icon { display: block; color: var(--text-white); }
        
        .offer-amount {
            font-size: 4rem;
            font-weight: 700;
            color: var(--text-white);
            background: var(--panel-blue);
            padding: 10px 30px;
            border: 2px solid white;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px var(--panel-blue);
        }

        /* BUTTONS */
        .btn {
            border: none; border-radius: 5px; padding: 15px 40px;
            font-size: 1.5rem; font-weight: 700; cursor: pointer;
            font-family: var(--font-ui); text-transform: uppercase;
            transition: transform 0.2s; box-shadow: 0 5px 0 rgba(0,0,0,0.5);
        }
        .btn:active { transform: translateY(5px); box-shadow: none; }
        
        .btn-restart { background: var(--gold-accent); color: #000; }
        .btn-deal { background: var(--panel-red); color: white; border: 2px solid white; }
        .btn-no-deal { background: var(--panel-blue); color: white; border: 2px solid white; }

        .decision-buttons { display: flex; gap: 30px; }

    </style>
</head>
<body>
    <div class="game-container">
        <header class="header">
            <img src="logo.jpeg" alt="STEPZ DEBATES Logo" class="logo">
            <h1>Deal or No Deal</h1>
        </header>

        <div class="game-board">
            <div class="values-board" id="values-low"><ul></ul></div>

            <div class="main-content">
                <div class="game-status" id="game-status">Welcome to the Dream Factory</div>
                <div class="briefcase-grid" id="briefcase-grid"></div>
                
                <div class="player-box-area" id="player-box-area" style="display: none;">
                    <h3>YOUR BOX</h3>
                    <div class="player-box-display" id="player-box-wrapper"></div>
                </div>
            </div>

            <div class="values-board" id="values-high"><ul></ul></div>
        </div>

        <div class="overlay active" id="start-overlay">
            <h2>The Game Begins</h2>
            <button class="btn btn-restart" id="start-btn">PLAY</button>
        </div>

        <div class="overlay" id="banker-overlay">
            <div class="phone-icon">☎️</div>
            <h2>Banker's Offer</h2>
            <div class="offer-amount" id="offer-amount">£0.00</div>
            <div class="decision-buttons">
                <button class="btn btn-deal" id="deal-btn">DEAL</button>
                <button class="btn btn-no-deal" id="no-deal-btn">NO DEAL</button>
            </div>
        </div>

        <div class="overlay" id="game-over-overlay">
            <h2 id="game-over-title"></h2>
            <p id="game-over-message" style="font-size: 1.5rem; margin-bottom: 20px;"></p>
            <button class="btn btn-restart" id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- CONFIG ---
    // Reverting to your exact 16 values for the 4x4 grid logic:
    const GAME_VALUES = [0.01, 1, 5, 10, 25, 50, 75, 100, 200, 300, 400, 500, 750, 1000, 5000, 10000];
    
    const ROUNDS = [5, 4, 3, 2];
    const BRIEFCASE_COUNT = 16;
    
    let gameState = 'INIT';
    let briefcases = [];
    let playerBox = null;
    let currentRound = 0;
    let toOpenThisRound = 0;

    // --- ELEMENTS ---
    const valuesLowContainer = document.querySelector('#values-low ul');
    const valuesHighContainer = document.querySelector('#values-high ul');
    const statusDisplay = document.getElementById('game-status');
    const briefcaseGrid = document.getElementById('briefcase-grid');
    const playerBoxArea = document.getElementById('player-box-area');
    const playerBoxWrapper = document.getElementById('player-box-wrapper');
    const bankerOverlay = document.getElementById('banker-overlay');
    
    // --- HELPERS ---
    const formatCurrency = (val) => `£${val.toLocaleString('en-GB', { minimumFractionDigits: 2 })}`;
    const shuffle = (arr) => arr.sort(() => Math.random() - 0.5);

    // --- RENDER BOARDS ---
    function renderValuesBoard() {
        valuesLowContainer.innerHTML = '';
        valuesHighContainer.innerHTML = '';
        const sorted = [...GAME_VALUES].sort((a,b) => a-b);
        
        sorted.forEach(val => {
            const li = document.createElement('li');
            li.textContent = formatCurrency(val);
            li.dataset.value = val;
            
            // Check if eliminated
            const isGone = briefcases.some(b => b.value === val && b.opened);
            if (isGone) li.classList.add('eliminated');

            if (val < 750) { // Split point based on your 16 values
                li.classList.add('low');
                valuesLowContainer.appendChild(li);
            } else {
                li.classList.add('high');
                valuesHighContainer.appendChild(li);
            }
        });
    }

    // --- RENDER BRIEFCASE (3D) ---
    function createBriefcaseElement(boxData, isSmall = false) {
        const container = document.createElement('div');
        container.classList.add('briefcase-container');
        container.dataset.id = boxData.id;
        if (boxData.opened) container.classList.add('opened');
        
        // Front Face (Red Box)
        const front = document.createElement('div');
        front.classList.add('briefcase-face', 'briefcase-front');
        front.textContent = boxData.id;

        // Back Face (Value)
        const back = document.createElement('div');
        back.classList.add('briefcase-face', 'briefcase-back');
        back.textContent = formatCurrency(boxData.value);
        
        if (boxData.value < 750) back.classList.add('val-low');
        else back.classList.add('val-high');

        container.appendChild(front);
        container.appendChild(back);
        
        return container;
    }

    function renderGrid() {
        briefcaseGrid.innerHTML = '';
        briefcases.forEach(box => {
            const el = createBriefcaseElement(box);
            if (playerBox && box.id === playerBox.id) {
                el.classList.add('chosen'); // Hide from grid
            }
            briefcaseGrid.appendChild(el);
        });
    }

    // --- GAME FLOW ---
    function initGame() {
        document.getElementById('start-overlay').classList.remove('active');
        document.getElementById('game-over-overlay').classList.remove('active');
        bankerOverlay.classList.remove('active');
        bankerOverlay.classList.remove('banker-active');
        playerBoxArea.style.display = 'none';

        const shuffledVals = shuffle([...GAME_VALUES]);
        briefcases = [];
        for(let i=1; i<=BRIEFCASE_COUNT; i++) {
            briefcases.push({ id: i, value: shuffledVals[i-1], opened: false });
        }
        
        playerBox = null;
        currentRound = 0;
        gameState = 'PICK_BOX';
        
        renderValuesBoard();
        renderGrid();
        updateStatus("Select your lucky box to keep.");
    }

    function updateStatus(msg) {
        statusDisplay.textContent = msg;
    }

    function handleBoxClick(id) {
        const box = briefcases.find(b => b.id === id);
        if (!box || box.opened) return;

        if (gameState === 'PICK_BOX') {
            playerBox = box;
            // Move box to player area
            playerBoxWrapper.innerHTML = '';
            playerBoxWrapper.appendChild(createBriefcaseElement(playerBox));
            playerBoxArea.style.display = 'block';
            
            renderGrid(); // Re-render to hide picked box
            startRound();
        } else if (gameState === 'OPENING' && box.id !== playerBox.id) {
            // OPEN BOX LOGIC
            box.opened = true;
            
            // Find the element and flip it
            const el = document.querySelector(`.briefcase-container[data-id="${id}"]`);
            if(el) el.classList.add('opened');

            // Delay updating the board for tension
            setTimeout(() => {
                renderValuesBoard();
                toOpenThisRound--;
                
                if (toOpenThisRound === 0) {
                    gameState = 'DEAL_TIME';
                    setTimeout(bankerCalls, 1000);
                } else {
                    updateStatus(`Open ${toOpenThisRound} more box${toOpenThisRound > 1 ? 'es' : ''}...`);
                }
            }, 600); // 600ms matches the CSS transition time
        }
    }

    function startRound() {
        if (currentRound >= ROUNDS.length) {
            endGame('final_swap'); // Or straight to reveal
            return;
        }
        toOpenThisRound = ROUNDS[currentRound];
        currentRound++;
        gameState = 'OPENING';
        updateStatus(`Round ${currentRound}: Open ${toOpenThisRound} boxes.`);
    }

    function bankerCalls() {
        updateStatus("The Banker is calling...");
        bankerOverlay.classList.add('banker-active'); // Show phone ringing
        // Wait 2 seconds for "Ring Ring"
        setTimeout(showOffer, 2500);
    }

    function showOffer() {
        bankerOverlay.classList.remove('banker-active');
        
        // Calculate Offer
        const remaining = briefcases.filter(b => !b.opened).map(b => b.value);
        const avg = remaining.reduce((a,b)=>a+b, 0) / remaining.length;
        const roundFactor = (currentRound / (ROUNDS.length + 1)) * 0.9;
        const offer = Math.round(avg * roundFactor);

        // Only show if boxes remain
        if (remaining.length < 2) {
             finalReveal();
             return;
        }

        document.getElementById('offer-amount').textContent = formatCurrency(offer);
        bankerOverlay.classList.add('active');
    }
    
    function finalReveal() {
        // Just reveal the player box
        endGame('final_reveal');
    }

    function endGame(type, amount=0) {
        bankerOverlay.classList.remove('active');
        const playerVal = playerBox.value;
        const msgEl = document.getElementById('game-over-message');
        const titleEl = document.getElementById('game-over-title');
        
        // Open the player's box visually
        const pBoxEl = playerBoxWrapper.querySelector('.briefcase-container');
        if(pBoxEl) pBoxEl.classList.add('opened');

        if (type === 'deal') {
            titleEl.textContent = "DEAL!";
            titleEl.style.color = "var(--panel-red)";
            msgEl.innerHTML = `You sold your box for <strong>${formatCurrency(amount)}</strong>.<br>It contained: <strong>${formatCurrency(playerVal)}</strong>`;
        } else {
            titleEl.textContent = "GAME OVER";
            titleEl.style.color = "var(--gold-accent)";
            msgEl.innerHTML = `You went all the way!<br>Your box contained: <strong>${formatCurrency(playerVal)}</strong>`;
        }
        
        setTimeout(() => {
            document.getElementById('game-over-overlay').classList.add('active');
        }, 2000); // Wait for player to see their box open
    }

    // --- LISTENERS ---
    document.getElementById('start-btn').addEventListener('click', initGame);
    document.getElementById('restart-btn').addEventListener('click', initGame);
    
    briefcaseGrid.addEventListener('click', (e) => {
        const box = e.target.closest('.briefcase-container');
        if(box) handleBoxClick(parseInt(box.dataset.id));
    });

    document.getElementById('deal-btn').addEventListener('click', () => {
        const txt = document.getElementById('offer-amount').textContent;
        const val = parseFloat(txt.replace(/[^0-9.-]+/g,""));
        endGame('deal', val);
    });

    document.getElementById('no-deal-btn').addEventListener('click', () => {
        bankerOverlay.classList.remove('active');
        if (briefcases.filter(b => !b.opened).length <= 2) {
            // Final two logic usually
             finalReveal();
        } else {
             startRound();
        }
    });
});
</script>
</body>
</html>
