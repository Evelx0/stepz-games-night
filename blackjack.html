<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Breach - STEPZ DEBATES</title>
    <style>
        /* --- FONT IMPORT --- */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        /* --- GLOBAL STYLES & VARIABLES --- */
        :root {
            --bg-color: #050505;
            --terminal-bg: #0a0a0a;
            --primary-accent: #d633b6; /* Neon Pink/Purple */
            --hacker-green: #0f0;       /* Terminal Green */
            --danger-red: #f00;
            --muted-green: #004400;
            --font-family: 'VT323', monospace;
            --scanline-color: rgba(0, 255, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--hacker-green);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            /* CRT Scanline Effect */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        /* --- MAIN TERMINAL CONTAINER --- */
        .terminal-container {
            width: 100%;
            max-width: 650px;
            background-color: var(--terminal-bg);
            border: 2px solid var(--hacker-green);
            box-shadow: 0 0 20px var(--hacker-green);
            padding: 30px;
            position: relative;
            text-transform: uppercase;
        }

        /* --- HEADER --- */
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--muted-green);
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px var(--primary-accent);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        
        .header p {
            color: var(--primary-accent);
            font-size: 1.2rem;
        }

        /* --- STATUS BAR --- */
        .system-status {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 20px;
            min-height: 35px;
            text-shadow: 0 0 5px var(--hacker-green);
            background: rgba(0, 255, 0, 0.1);
            padding: 5px;
            border: 1px dashed var(--muted-green);
        }

        /* --- DATA ZONES (Previously Hands) --- */
        .data-zone {
            margin-bottom: 30px;
        }

        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary-accent);
            padding-left: 10px;
            background: linear-gradient(90deg, rgba(214, 51, 182, 0.1), transparent);
        }

        .zone-header h3 {
            font-size: 1.4rem;
            color: #fff;
        }

        .score-display {
            font-size: 1.6rem;
            color: var(--primary-accent);
            font-weight: bold;
        }

        .data-stream {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 80px;
        }

        /* --- DATA PACKETS (Replaces Cards) --- */
        .data-packet {
            width: 60px;
            height: 60px;
            background-color: #000;
            border: 2px solid var(--hacker-green);
            color: var(--hacker-green);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            box-shadow: 0 0 8px var(--hacker-green);
            position: relative;
            animation: upload-packet 0.2s steps(5);
        }

        .data-packet::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 4px;
            height: 4px;
            background-color: var(--hacker-green);
        }

        /* Hidden packet (Face down card) */
        .data-packet.encrypted {
            background-color: var(--muted-green);
            border-color: var(--muted-green);
            color: transparent;
            background-image: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 5px,
                #002200 5px,
                #002200 10px
            );
        }
        
        .data-packet.encrypted::after {
            content: 'LOCKED';
            color: rgba(0,255,0,0.5);
            font-size: 0.8rem;
            position: absolute;
            letter-spacing: 1px;
        }

        /* High Value Packet Color */
        .packet-high {
            border-color: var(--primary-accent);
            color: var(--primary-accent);
            box-shadow: 0 0 8px var(--primary-accent);
        }
        .packet-high::before { background-color: var(--primary-accent); }

        @keyframes upload-packet {
            from { opacity: 0; transform: scale(0.1); }
            to { opacity: 1; transform: scale(1); }
        }

        /* --- CONTROLS --- */
        .control-panel {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            border-top: 1px solid var(--muted-green);
            padding-top: 20px;
        }

        .cmd-btn {
            background: transparent;
            border: 2px solid var(--hacker-green);
            color: var(--hacker-green);
            padding: 10px 30px;
            font-family: var(--font-family);
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .cmd-btn:hover:not(:disabled) {
            background: var(--hacker-green);
            color: #000;
            box-shadow: 0 0 15px var(--hacker-green);
        }
        
        .cmd-btn:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }

        .btn-stand {
            border-color: var(--primary-accent);
            color: var(--primary-accent);
        }

        .btn-stand:hover:not(:disabled) {
            background: var(--primary-accent);
            color: #000;
            box-shadow: 0 0 15px var(--primary-accent);
        }

        /* --- OVERLAYS --- */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: opacity 0.3s;
            z-index: 10;
            border: 2px solid var(--primary-accent);
        }

        .overlay.active { opacity: 1; visibility: visible; }
        
        .overlay h2 { 
            font-size: 4rem; 
            margin-bottom: 10px; 
            color: #fff;
            text-shadow: 4px 4px var(--primary-accent);
        }
        
        .overlay p { 
            font-size: 1.5rem; 
            color: var(--hacker-green); 
            margin-bottom: 30px; 
        }

        .btn-restart {
            background: var(--primary-accent);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-family: var(--font-family);
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 0 20px var(--primary-accent);
        }
        
        .btn-restart:hover {
            transform: scale(1.05);
            background: #fff;
            color: var(--primary-accent);
        }

    </style>
</head>
<body>

    <div class="terminal-container">
        
        <div class="header">
            <h1>SYSTEM BREACH v2.1</h1>
            <p>> TARGET INTEGRITY: 21</p>
        </div>
        
        <div class="system-status" id="status-message">INITIALIZING CONNECTION...</div>

        <div class="data-zone">
            <div class="zone-header">
                <h3>FIREWALL [SYSTEM]</h3>
                <span class="score-display" id="dealer-score">--</span>
            </div>
            <div class="data-stream" id="dealer-cards"></div>
        </div>

        <div class="data-zone">
            <div class="zone-header">
                <h3>UPLOAD STREAM [USER]</h3>
                <span class="score-display" id="player-score">0</span>
            </div>
            <div class="data-stream" id="player-cards"></div>
        </div>
        
        <div class="control-panel" id="player-controls">
            <button class="cmd-btn" id="hit-btn">[ INJECT DATA ]</button>
            <button class="cmd-btn btn-stand" id="stand-btn">[ EXECUTE ]</button>
        </div>

        <div class="overlay active" id="start-overlay">
            <h2>READY?</h2>
            <p>UPLOAD 21TB TO BREACH.</p>
            <button class="btn-restart" id="start-btn">INITIATE HACK</button>
        </div>

        <div class="overlay" id="game-over-overlay">
            <h2 id="game-over-title">TERMINATED</h2>
            <p id="game-over-message">CONNECTION LOST</p>
            <button class="btn-restart" id="restart-btn">RETRY</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // --- DOM ELEMENTS ---
            const statusMessage = document.getElementById('status-message');
            const dealerZone = document.getElementById('dealer-cards');
            const playerZone = document.getElementById('player-cards');
            const dealerScoreDisplay = document.getElementById('dealer-score');
            const playerScoreDisplay = document.getElementById('player-score');
            const playerControls = document.getElementById('player-controls');
            const hitBtn = document.getElementById('hit-btn');
            const standBtn = document.getElementById('stand-btn');
            
            const startOverlay = document.getElementById('start-overlay');
            const gameOverOverlay = document.getElementById('game-over-overlay');
            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');
            const gameOverTitle = document.getElementById('game-over-title');
            const gameOverMessage = document.getElementById('game-over-message');

            // --- CONFIG ---
            // We keep the internal math of a 52 card deck for probability fairness,
            // but we remove the concept of "Suits" and "Kings" from the display.
            const values = ['2', '3', '4', '5', '6', '7', '8', '9', '10', '10', '10', '10', '11']; 
            // Note: In visual logic:
            // 10 = 10, J=10, Q=10, K=10. I will represent them all as just "10" 
            // A = 11 (or 1)
            
            let deck = [];
            let playerHand = [];
            let dealerHand = [];
            let playerScore = 0;
            let dealerScore = 0;
            let dealerHiddenCard = null;

            // --- LOGIC FUNCTIONS ---
            function createDeck() {
                deck = [];
                // We create 4 sets of data to mimic a standard deck probability
                for (let i = 0; i < 4; i++) {
                    // 2 through 9
                    for (let j = 2; j <= 9; j++) deck.push({ display: j.toString(), val: j });
                    // 10, J, Q, K (All worth 10, displayed as raw data 10)
                    for (let k = 0; k < 4; k++) deck.push({ display: '10', val: 10 });
                    // Ace
                    deck.push({ display: 'A', val: 11 }); // Ace logic handled in calc
                }
            }

            function shuffleDeck() {
                for (let i = deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [deck[i], deck[j]] = [deck[j], deck[i]];
                }
            }
            
            function calculateScore(hand) {
                let score = 0;
                let aceCount = 0;
                for (const card of hand) {
                    if (card.display === 'A') {
                        aceCount++;
                        score += 11;
                    } else {
                        score += card.val;
                    }
                }
                // Adjust for Aces if bust
                while (score > 21 && aceCount > 0) {
                    score -= 10;
                    aceCount--;
                }
                return score;
            }

            // --- RENDER FUNCTIONS ---
            function createPacketElement(card, isHidden = false) {
                const packetDiv = document.createElement('div');
                packetDiv.classList.add('data-packet');

                // High value packets get special color (Aces and 10s)
                if (card.val >= 10) {
                    packetDiv.classList.add('packet-high');
                }

                if (isHidden) {
                    packetDiv.classList.add('encrypted');
                    packetDiv.textContent = ''; // Hidden
                } else {
                    // If it's an Ace, display 'A', otherwise the number
                    packetDiv.textContent = card.display;
                }
                return packetDiv;
            }

            function updateUI() {
                playerScore = calculateScore(playerHand);
                
                // Calculate Dealer score (only showing visible cards)
                const visibleDealerHand = dealerHand.filter(c => !c.hidden);
                dealerScore = calculateScore(visibleDealerHand);
                
                playerScoreDisplay.textContent = playerScore + " TB";
                dealerScoreDisplay.textContent = dealerScore + " TB";

                if (playerScore > 21) {
                    stand(true); // Forced stand (bust)
                }
            }
            
            function dealPacket(hand, container, isHidden = false) {
                const card = deck.pop();
                card.hidden = isHidden;
                hand.push(card);
                container.appendChild(createPacketElement(card, isHidden));
                if (isHidden) dealerHiddenCard = card;
            }
            
            // --- GAME FLOW ---
            function startGame() {
                playerHand = [];
                dealerHand = [];
                dealerHiddenCard = null;

                startOverlay.classList.remove('active');
                gameOverOverlay.classList.remove('active');
                playerControls.style.display = 'flex';
                hitBtn.disabled = false;
                standBtn.disabled = false;
                
                statusMessage.textContent = "> AWAITING INPUT...";
                statusMessage.style.color = 'var(--hacker-green)';

                dealerZone.innerHTML = '';
                playerZone.innerHTML = '';

                createDeck();
                shuffleDeck();

                // Deal Sequence
                dealPacket(playerHand, playerZone);
                dealPacket(dealerHand, dealerZone);
                dealPacket(playerHand, playerZone);
                dealPacket(dealerHand, dealerZone, true); // Hidden Firewall packet

                updateUI();
                
                // Instant Blackjack Check
                if (playerScore === 21) {
                    statusMessage.textContent = '>> CRITICAL HIT!';
                    stand();
                }
            }
            
            function hit() {
                dealPacket(playerHand, playerZone);
                updateUI();
            }

            function stand(bust = false) {
                hitBtn.disabled = true;
                standBtn.disabled = true;
                
                if (bust) {
                    statusMessage.textContent = ">> WARNING: OVERLOAD DETECTED";
                    statusMessage.style.color = "var(--danger-red)";
                    setTimeout(() => dealerTurn(), 1000);
                } else {
                    statusMessage.textContent = ">> EXECUTING HACK...";
                    dealerTurn();
                }
            }

            async function dealerTurn() {
                // Reveal the hidden packet
                const hiddenEl = dealerZone.querySelector('.encrypted');
                if (hiddenEl) {
                    hiddenEl.classList.remove('encrypted');
                    // Add high value class if needed
                    if (dealerHiddenCard.val >= 10) hiddenEl.classList.add('packet-high');
                    hiddenEl.textContent = dealerHiddenCard.display;
                }
                
                dealerHiddenCard.hidden = false;
                let actualDealerScore = calculateScore(dealerHand);
                dealerScoreDisplay.textContent = actualDealerScore + " TB";

                // If player already busted, dealer doesn't need to hit
                if (playerScore > 21) {
                    determineWinner(actualDealerScore);
                    return;
                }

                // Firewall Logic: Hit until 17
                while (actualDealerScore < 17) {
                    await new Promise(r => setTimeout(r, 800)); // Processing delay
                    dealPacket(dealerHand, dealerZone);
                    actualDealerScore = calculateScore(dealerHand);
                    dealerScoreDisplay.textContent = actualDealerScore + " TB";
                }
                
                determineWinner(actualDealerScore);
            }

            function determineWinner(finalDealerScore) {
                let title = '';
                let message = '';
                let titleColor = '';

                const pBust = playerScore > 21;
                const dBust = finalDealerScore > 21;

                if (pBust) {
                    title = 'SYSTEM FAILURE';
                    message = `BANDWIDTH OVERLOADED. FIREWALL AT ${finalDealerScore} TB.`;
                    titleColor = 'var(--danger-red)';
                } else if (dBust) {
                    title = 'BREACH SUCCESSFUL';
                    message = `FIREWALL CRASHED AT ${finalDealerScore} TB. YOU'RE IN.`;
                    titleColor = 'var(--hacker-green)';
                } else if (playerScore > finalDealerScore) {
                    title = 'ACCESS GRANTED';
                    message = `UPLOAD COMPLETE: ${playerScore} TB vs ${finalDealerScore} TB.`;
                    titleColor = 'var(--primary-accent)';
                } else if (finalDealerScore > playerScore) {
                    title = 'ACCESS DENIED';
                    message = `FIREWALL STRONGER: ${finalDealerScore} TB vs ${playerScore} TB.`;
                    titleColor = 'var(--danger-red)';
                } else {
                    title = 'CONNECTION STALLED';
                    message = `EQUAL LOAD: ${playerScore} TB. RETRY?`;
                    titleColor = '#fff';
                }
                
                setTimeout(() => {
                    gameOverTitle.textContent = title;
                    gameOverTitle.style.color = titleColor;
                    gameOverMessage.textContent = message;
                    gameOverOverlay.classList.add('active');
                }, 1000);
            }

            // --- EVENTS ---
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', startGame);
            hitBtn.addEventListener('click', hit);
            standBtn.addEventListener('click', () => stand(false));
        });
    </script>
</body>
</html>
